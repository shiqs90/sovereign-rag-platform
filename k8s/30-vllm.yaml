# vLLM — the only pod on the GPU node.
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: rag-platform
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: rag-platform
spec:
  replicas: 1
  # Recreate, NOT the default RollingUpdate. With replicas: 1 the defaults are
  # maxSurge: 25% (rounds UP to 1) and maxUnavailable: 25% (rounds DOWN to 0), so Kubernetes
  # must start the new pod before removing the old one. The GPU pool has exactly one node
  # with one nvidia.com/gpu, which the old pod still holds — so the new pod sits Pending
  # forever waiting for a resource only its own readiness would free. Deadlock.
  #
  # There is no availability to protect on a single-replica GPU service, so the
  # "zero-downtime" default buys nothing and costs a hung rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # LOAD-BEARING. Kubernetes injects env vars for every Service in the namespace, so a
      # Service named `vllm` produces VLLM_PORT=tcp://10.0.x.x:8000. vLLM reads VLLM_PORT
      # as its own listen port, fails to parse "tcp://...", and crashes on startup.
      enableServiceLinks: false
      nodeSelector:
        workload: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.22.1
          args:
            - --model=Qwen/Qwen2.5-7B-Instruct-AWQ
            # awq, NOT awq_marlin — Marlin kernels require SM 8.0+; the T4 is SM 7.5.
            - --quantization=awq
            # Turing has no bf16. Omitting this lets vLLM pick bfloat16 and abort.
            - --dtype=float16
            # CUDA graph capture costs ~1-2 GiB of VRAM we would rather spend on KV cache.
            - --enforce-eager
            - --gpu-memory-utilization=0.90
            - --max-model-len=8192
            - --max-num-seqs=8
            # Emit OpenAI-format tool_calls objects instead of raw text. Required by the
            # agentic loop; harmless before it exists.
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            # THE T4 LANDMINE THAT SURVIVES STARTUP. Left on auto, vLLM v0.22 rejects
            # FlashAttention-2 ("compute capability >= 8") and falls back to FLASHINFER,
            # whose prefill kernels ALSO need SM 8.0+. Nothing fails at boot — /health
            # passed for 37 hours — because health checks run no inference. The engine dies
            # on the FIRST REAL PREFILL:
            #   RuntimeError: BatchPrefillWithPagedKVCache failed with error invalid argument
            #   vllm.v1.engine.exceptions.EngineDeadError
            #
            # This is a CLI FLAG in v0.22. The VLLM_ATTENTION_BACKEND env var was REMOVED —
            # setting it produces only "Unknown vLLM environment variable detected" and is
            # otherwise ignored, so the engine still picks FlashInfer.
            - --attention-backend=TRITON_ATTN
          ports:
            - containerPort: 8000
          env:
            - name: HF_HOME
              value: /cache
          volumeMounts:
            - name: cache
              mountPath: /cache
          # ~5.6 GB download plus weight load. 60 x 10s = 10 minutes before the kubelet
          # gives up. On a cold node this genuinely takes 5-8 minutes.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          resources:
            limits:
              # Requesting the GPU is what makes the device plugin bind it. Without this
              # the pod schedules onto the node and sees no GPU at all.
              nvidia.com/gpu: 1
      volumes:
        - name: cache
          emptyDir: {}
