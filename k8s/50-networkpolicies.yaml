# ---------------------------------------------------------------- rag-platform
---
# Ingress-only restriction. Platform services accept traffic from tenant namespaces and
# nothing else — no path in from outside the cluster.
#
# Egress is deliberately NOT restricted here: TEI and vLLM download their weights from
# huggingface.co on first start. Locking egress down would require an allowlist of Hugging
# Face and CDN addresses that change without notice. The production answer is to bake
# weights into the image or serve them from Blob Storage, which removes the internet
# dependency entirely and lets this become default-deny too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-tenants
  namespace: rag-platform
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tenant: "true"
