# The network half of the isolation claim.
#
# These are enforced ONLY because the cluster was created with network_policy = "calico"
# (terraform/aks.tf). Without an engine the API server accepts every object below and
# enforces none of them — `kubectl get netpol` looks correct while nothing is isolated.
# The engine cannot be added to a live cluster.
#
# Namespaces are matched on kubernetes.io/metadata.name, a label the API server sets
# automatically and cannot drift from the actual namespace name.

# ---------------------------------------------------------------- tenant-a
# Default deny, both directions. An empty podSelector selects every pod in the namespace;
# naming both policyTypes with no rules denies everything. Every allowance below is
# additive — NetworkPolicies union, they never subtract.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: tenant-a
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS. THE classic mistake: apply default-deny egress, forget port 53, then spend an hour
# debugging "Qdrant is down" when the pod cannot resolve the name at all.
# Both UDP and TCP — resolvers fall back to TCP for large responses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tenant-a
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The only egress a tenant pod gets: the three platform services. No internet, and — the
# point of the exercise — no route to the other tenant's namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-platform
  namespace: tenant-a
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rag-platform
      # THESE ARE POD PORTS, NOT SERVICE PORTS. NetworkPolicy is evaluated after
      # kube-proxy has already DNAT'd the Service VIP to a pod IP, so what matters is
      # the containerPort. The TEI Service listens on 80 but targets 8080 — allowing
      # 80 here matched nothing and every embed call hung until it timed out.
      # Qdrant and vLLM only worked because their Service and pod ports are identical.
      ports:
        - protocol: TCP
          port: 6333 # qdrant   svc 6333 -> pod 6333
        - protocol: TCP
          port: 8080 # tei      svc 80   -> pod 8080
        - protocol: TCP
          port: 8000 # vllm     svc 8000 -> pod 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-nginx
  namespace: tenant-a
spec:
  podSelector:
    matchLabels:
      app: rag
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

# ---------------------------------------------------------------- tenant-b
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: tenant-b
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tenant-b
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-platform
  namespace: tenant-b
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rag-platform
      # POD ports, not Service ports — see the tenant-a policy above for why.
      ports:
